name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No version pinned here on purpose: packageManager in package.json is
      # the single source of truth, and naming it twice is an error.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      # Informational only. The probe reaches the real testnet host and reads
      # nothing but public endpoints, but Binance answers GitHub-hosted runners
      # with HTTP 451, so this cannot gate a merge. Run `pnpm probe` locally to
      # actually verify reachability and correlation; the suite above needs no
      # network and is what CI is really checking.
      - name: Capability probe (read-only, informational)
        continue-on-error: true
        run: pnpm probe
